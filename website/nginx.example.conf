# Example nginx site for the Slifer landing page.
# Install path on the VPS: /etc/nginx/sites-available/sliferlauncher.com
# Enable: ln -s /etc/nginx/sites-available/sliferlauncher.com /etc/nginx/sites-enabled/
#
# Leave your existing store-api / subdomain server block unchanged.

server {
    listen 80;
    listen [::]:80;
    server_name sliferlauncher.com www.sliferlauncher.com;

    # After certbot, this block becomes an HTTPS redirect.
    # certbot --nginx -d sliferlauncher.com -d www.sliferlauncher.com

    root /var/www/sliferlauncher.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|svg|ico|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# After Let's Encrypt, certbot typically adds a companion :443 server.
# Keep apex + www on the static root above; do NOT proxy them to store-api.
